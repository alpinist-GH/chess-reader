# Codemagic CI config for ChessBook Reader.
#
# The Flutter app lives in the chess_reader/ subfolder of this repo, so every
# build step cd's into it first.
#
#   ios-testflight : builds a SIGNED .ipa and uploads it to TestFlight. Requires
#                    a paid Apple Developer Program membership and an App Store
#                    Connect API key added to Codemagic (Teams/User settings ->
#                    Integrations -> App Store Connect) under the name shown in
#                    `integrations.app_store_connect` below.
#
#   ios-sideload : builds an UNSIGNED .ipa. You sign it locally with a FREE
#                  Apple ID using Sideloadly or AltStore on your Windows PC and
#                  install it over USB. No Apple credentials are stored here, so
#                  no paid Developer Program is required. (7-day app expiry.)
#
#   macos-dmg    : builds an UNSIGNED .dmg. Quick local testing only; Gatekeeper
#                  will warn on other machines.
#
#   macos-devid  : builds a Developer ID-signed + Apple-NOTARIZED .dmg for direct
#                  download (no App Store). No Gatekeeper warning. Reuses the
#                  `appstore` group (CERTIFICATE_PRIVATE_KEY) + App Store Connect
#                  integration. One-time setup: see the comments in the workflow.
#
#   macos-appstore  : builds a signed .pkg and uploads it to the Mac App Store.
#                     Uses `xcodebuild archive` to produce a distribution-signed
#                     .app, then `productbuild --sign` to build the installer
#                     .pkg. (exportArchive was abandoned: it re-signs the app
#                     code with the installer cert and fails on the CI runner.)
#
# In-app purchase (freemium meter + RevenueCat lifetime unlock):
#   The meter/paywall are gated by the compile-time `ENABLE_IAP` dart-define and
#   only injected into the STORE workflows below — ios-testflight and
#   macos-appstore. The sideload/DMG/devid workflows deliberately omit it so
#   those builds stay fully unlocked (RevenueCat's SDK can't take payment via a
#   free-Apple-ID sideload or a direct-download DMG). Create a `revenuecat`
#   variable group in the Codemagic UI holding the RevenueCat *public* SDK keys:
#       REVENUECAT_IOS_KEY    (appl_… key for the iOS app)
#       REVENUECAT_MACOS_KEY  (appl_… key for the macOS app)
#   These are embedded in the shipped binary (not secret), but live in a group
#   so they aren't committed. An unset key just leaves metering local (no crash).
#   (No Android workflow exists here — set ENABLE_IAP + REVENUECAT_ANDROID_KEY
#   wherever the Google Play build is produced.)

workflows:
  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      # Must match the App Store Connect API key integration name in Codemagic.
      app_store_connect: Codemagic
    environment:
      flutter: stable
      # NOTE: no `ios_signing:` block here on purpose. That block enables
      # Codemagic's *automatic* signing, which only FETCHES existing profiles
      # and fails with "no matching profiles found" on a fresh account. We do
      # signing manually below so we can pass --create.
      groups:
        # Variable group (created in the Codemagic UI) that holds the secure
        # CERTIFICATE_PRIVATE_KEY. It is only injected into the build if listed
        # here. The key itself is NEVER stored in this file.
        - appstore
        # RevenueCat public SDK keys (REVENUECAT_IOS_KEY). Store workflow only.
        - revenuecat
      vars:
        FLUTTER_PROJECT: chess_reader
        BUNDLE_ID: com.alpinist.chessBookReader
    scripts:
      - name: Set up code signing
        script: |
          # Create the distribution certificate + App Store provisioning profile
          # (and register the bundle ID if needed) via the App Store Connect API
          # key, then apply them to the Xcode project. --create makes this work
          # on the very first build when no profile exists yet.
          keychain initialize
          # --certificate-key lets the CLI CREATE the iOS distribution
          # certificate (not just the profile) when none exists yet, and reuse
          # the same one on later builds. CERTIFICATE_PRIVATE_KEY is a secure
          # env var you add in Codemagic (the RSA private key).
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key "@env:CERTIFICATE_PRIVATE_KEY" \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Use CocoaPods instead of Swift Package Manager
        script: |
          # ONNX Runtime's SPM framework ships with a missing MinimumOSVersion,
          # which fails App Store validation (ITMS-90208). The multistockfish
          # plugins don't support SPM either. Disabling SPM makes Flutter
          # integrate every iOS plugin via CocoaPods, which avoids both issues.
          flutter config --no-enable-swift-package-manager
      - name: Flutter pub get
        script: |
          cd "$FLUTTER_PROJECT"
          flutter pub get
      - name: Build signed IPA
        script: |
          cd "$FLUTTER_PROJECT"
          # $PROJECT_BUILD_NUMBER is Codemagic's monotonic per-project counter,
          # so each upload to TestFlight gets a unique, increasing build number.
          # ENABLE_IAP turns on the freemium meter + paywall; the RevenueCat
          # public key wires up StoreKit purchases. Store build only.
          flutter build ipa --release \
            --build-number=$PROJECT_BUILD_NUMBER \
            --dart-define=ENABLE_IAP=true \
            --dart-define=REVENUECAT_IOS_KEY="$REVENUECAT_IOS_KEY" \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - $FLUTTER_PROJECT/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  ios-sideload:
    name: iOS unsigned (sideload)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      vars:
        FLUTTER_PROJECT: chess_reader
    scripts:
      - name: Flutter pub get
        script: |
          cd "$FLUTTER_PROJECT"
          flutter pub get
      - name: Build unsigned .app
        script: |
          cd "$FLUTTER_PROJECT"
          flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        script: |
          cd "$FLUTTER_PROJECT/build/ios/iphoneos"
          rm -rf Payload
          mkdir Payload
          cp -R Runner.app Payload/
          zip -r "$CM_BUILD_DIR/chessbook-reader-unsigned.ipa" Payload
    artifacts:
      - chessbook-reader-unsigned.ipa

  macos-dmg:
    name: macOS DMG (unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      vars:
        FLUTTER_PROJECT: chess_reader
    scripts:
      - name: Flutter pub get
        script: |
          cd "$FLUTTER_PROJECT"
          flutter pub get
      - name: Build macOS
        script: |
          cd "$FLUTTER_PROJECT"
          flutter build macos --release
      - name: Package DMG
        script: |
          cd "$FLUTTER_PROJECT"
          APP=$(ls -d build/macos/Build/Products/Release/*.app | head -1)
          hdiutil create -volname "ChessBook Reader" -srcfolder "$APP" \
            -ov -format UDZO "$CM_BUILD_DIR/chessbook-reader.dmg"
    artifacts:
      - chessbook-reader.dmg

  # ---------------------------------------------------------------------------
  # Developer ID-signed + notarized .dmg (direct download, NOT App Store).
  #
  # One-time setup before the first run:
  #   * Same App Store Connect API key integration (`Codemagic`) the iOS
  #     workflow uses (for notarization).
  #   * A Developer ID Application certificate CANNOT be created by the API key —
  #     Apple restricts that to the Account Holder via the portal (the API
  #     returns 403). So create it once, export it as a .p12, and add it to the
  #     `appstore` variable group in Codemagic as two SECURE vars:
  #       DEVID_CERTIFICATE          = base64 of the .p12
  #       DEVID_CERTIFICATE_PASSWORD = the .p12 export password
  #     How to make the .p12 (on your Mac, signed in as the Account Holder):
  #       1. Keychain Access -> Certificate Assistant -> Request a Certificate
  #          From a Certificate Authority -> save a CSR to disk.
  #       2. developer.apple.com -> Certificates -> + -> "Developer ID
  #          Application" -> upload the CSR -> download the .cer.
  #       3. Double-click the .cer to install, then in Keychain Access right-
  #          click it -> Export -> .p12 (set a password).
  #       4. base64 -i devid.p12 | pbcopy  -> paste as DEVID_CERTIFICATE.
  # ---------------------------------------------------------------------------
  macos-devid:
    name: macOS Developer ID (notarized DMG)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic
    environment:
      flutter: stable
      groups:
        - appstore
      vars:
        FLUTTER_PROJECT: chess_reader
    scripts:
      - name: Set up Developer ID signing
        script: |
          keychain initialize
          # Import the Developer ID Application .p12 supplied via env vars
          # (Apple won't let the API create this cert — Account Holder only).
          echo "$DEVID_CERTIFICATE" | base64 --decode > /tmp/devid.p12
          keychain add-certificates \
            --certificate /tmp/devid.p12 \
            --certificate-password "$DEVID_CERTIFICATE_PASSWORD"
      - name: Use CocoaPods instead of Swift Package Manager
        script: |
          flutter config --no-enable-swift-package-manager
      - name: Flutter pub get
        script: |
          cd "$FLUTTER_PROJECT"
          flutter pub get
      - name: Build and sign the app
        script: |
          cd "$FLUTTER_PROJECT"
          flutter build macos --release
          APP=$(ls -d build/macos/Build/Products/Release/*.app | head -1)
          # Re-sign every nested binary (frameworks, the multistockfish FFI
          # framework, dylibs) and the app with the Developer ID cert + hardened
          # runtime + timestamp — all required for notarization.
          CERT=$(security find-identity -v -p codesigning \
            | grep "Developer ID Application" | head -1 \
            | sed -E 's/.*"(.*)"/\1/')
          codesign --force --deep --options runtime --timestamp \
            --entitlements macos/Runner/Release.entitlements \
            --sign "$CERT" "$APP"
      - name: Notarize and package DMG
        script: |
          cd "$FLUTTER_PROJECT"
          APP=$(ls -d build/macos/Build/Products/Release/*.app | head -1)
          hdiutil create -volname "ChessBook Reader" -srcfolder "$APP" \
            -ov -format UDZO "$CM_BUILD_DIR/chessbook-reader.dmg"
          # Write the App Store Connect API private key to a temp file for notarytool.
          # The integration injects APP_STORE_CONNECT_PRIVATE_KEY, KEY_IDENTIFIER,
          # and ISSUER_ID as env vars.
          echo "$ASC_API_KEY_B64" | base64 --decode > /tmp/asc_key.p8
          xcrun notarytool submit "$CM_BUILD_DIR/chessbook-reader.dmg" \
            --key /tmp/asc_key.p8 \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --issuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --wait
          xcrun stapler staple "$CM_BUILD_DIR/chessbook-reader.dmg"
    artifacts:
      - chessbook-reader.dmg

  # ---------------------------------------------------------------------------
  # Mac App Store: build + submit via xcodebuild archive + productbuild.
  #
  # Signing approach (hard-won — see the long comments in each step):
  #   * `xcodebuild archive` produces a distribution-signed .app with the
  #     MAC_APP_STORE profile embedded (explicit manual signing, Apple
  #     Distribution cert).
  #   * `xcrun productbuild --sign` wraps it in an installer .pkg signed with the
  #     Mac Installer Distribution cert.
  #   * `xcodebuild -exportArchive` was tried and abandoned: it insists the
  #     installer cert be listed in the profile, then re-signs the app code with
  #     that installer cert and fails ("this identity cannot be used for signing
  #     code"). productbuild on the already-signed .app sidesteps that entirely.
  #     (The old fear that bare productbuild fails headless with
  #     CSSMERR_CSP_NO_USER_INTERACTION only applies to a hand-built keychain;
  #     Codemagic's `keychain add-certificates` sets the key partition list.)
  #
  # One-time setup (App Store Connect + Codemagic UI):
  #   1. App Store Connect: enable the macOS platform on the
  #      com.alpinist.chessBookReader app record.
  #   2. The same `appstore` variable group and `Codemagic` ASC integration
  #      that the ios-testflight workflow uses are all that's needed —
  #      fetch-signing-files will create the Mac App Distribution and Mac
  #      Installer Distribution certs (and MAC_APP_STORE profile) on first run.
  # ---------------------------------------------------------------------------
  macos-appstore:
    name: macOS App Store
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic
    environment:
      flutter: stable
      groups:
        - appstore
        # RevenueCat public SDK keys (REVENUECAT_MACOS_KEY). Store workflow only.
        - revenuecat
      vars:
        FLUTTER_PROJECT: chess_reader
        BUNDLE_ID: com.alpinist.chessBookReader
    scripts:
      - name: Set up code signing
        script: |
          keychain initialize

          # Step 1: Mac App Distribution (Apple Distribution) cert. fetch-signing-files
          # also fetches/creates a MAC_APP_STORE profile, but we REBUILD that profile
          # in step 3 — fetch reuses whatever profile already exists in App Store
          # Connect, and an earlier run left one that ALSO listed the installer cert.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type MAC_APP_STORE \
            --certificate-key "@env:CERTIFICATE_PRIVATE_KEY" \
            --create

          # Step 2: Mac Installer Distribution cert (dedicated MAC_INSTALLER_KEY,
          # PKCS#1 RSA format stored in Codemagic). A dedicated key guarantees the
          # .p12 always has the matching private key across runs. Added to the
          # keychain only — NOT to the profile — and used solely to sign the .pkg
          # (packageSigningCertificate in export_options.plist).
          # `certificates list` exits 0 even when empty — count .p12 files to detect
          # whether a cert was actually saved before deciding to create a new one.
          _cert_dir=~/Library/Developer/Xcode/UserData/Certificates
          _before=$(ls "$_cert_dir"/*.p12 2>/dev/null | wc -l)
          app-store-connect certificates list \
            --type MAC_INSTALLER_DISTRIBUTION \
            --certificate-key "@env:MAC_INSTALLER_KEY" \
            --save
          _after=$(ls "$_cert_dir"/*.p12 2>/dev/null | wc -l)
          if [ "$_after" -le "$_before" ]; then
            app-store-connect certificates create \
              --type MAC_INSTALLER_DISTRIBUTION \
              --certificate-key "@env:MAC_INSTALLER_KEY" \
              --save
          fi

          # Step 3: rebuild the MAC_APP_STORE profile so it lists BOTH the app cert
          # AND the installer cert. exportArchive (Export step) refuses to package
          # the .pkg unless the Mac Installer Distribution cert is listed in the
          # profile ("Provisioning profile doesn't include signing certificate ...").
          # Having the installer cert in the profile does NOT make the build sign
          # with it, because the keychain holds ONLY the app cert during build (the
          # installer cert is added to the keychain later, in the Export step).
          # We can't rely on fetch-signing-files' profile because it reuses a
          # possibly-stale ASC profile, so delete it and recreate clean.
          # Bundle id is a POSITIONAL arg; cert flag is --certificate-ids.
          # LP534HTRF4 is the stable ASC resource ID for com.alpinist.chessBookReader.
          APP_CERT_ID=$(ls "$_cert_dir"/DISTRIBUTION_*.p12 2>/dev/null \
            | head -1 | xargs basename 2>/dev/null \
            | sed 's/^DISTRIBUTION_\([^_]*\)_.*/\1/')
          INSTALLER_CERT_ID=$(ls "$_cert_dir"/MAC_INSTALLER_DISTRIBUTION_*.p12 2>/dev/null \
            | head -1 | xargs basename 2>/dev/null \
            | sed 's/^MAC_INSTALLER_DISTRIBUTION_\([^_]*\)_.*/\1/')
          echo "App cert: $APP_CERT_ID  Installer cert: $INSTALLER_CERT_ID"
          _profile_dir=~/"Library/Developer/Xcode/UserData/Provisioning Profiles"
          for pf in "$_profile_dir"/MAC_APP_STORE_*.provisionprofile; do
            [ -f "$pf" ] || continue
            pid=$(basename "$pf" | sed 's/^MAC_APP_STORE_\([^_]*\)_.*/\1/')
            app-store-connect profiles delete "$pid" || true
            rm -f "$pf"
          done
          app-store-connect profiles create \
            --name "ChessBook Reader mac_app_store" \
            --type MAC_APP_STORE \
            --certificate-ids "$APP_CERT_ID" "$INSTALLER_CERT_ID" \
            --save \
            LP534HTRF4

          # Add ONLY the app (Apple Distribution) cert to the keychain for the
          # build + archive. The installer cert is added later (Export step). If
          # both are present now, xcodebuild's signing — which falls back to
          # Automatic when use-profiles can't match — picks the installer cert
          # (it sorts first) and fails: "this identity cannot be used for signing
          # code". With only the app cert available, the build can't pick wrong.
          _app_p12=$(ls "$_cert_dir"/DISTRIBUTION_*.p12 2>/dev/null | head -1)
          keychain add-certificates --certificate "$_app_p12"
          xcode-project use-profiles
      - name: Flutter pub get + build
        script: |
          cd "$FLUTTER_PROJECT"
          flutter pub get
          # flutter build macos generates the ephemeral files (FlutterInputs/
          # FlutterOutputs.xcfilelist, FlutterGeneratedPluginSwiftPackage/
          # Package.swift) that xcodebuild archive needs before it can start.
          # The --dart-define values are persisted into Flutter-Generated.xcconfig
          # (DART_DEFINES), so the later `xcodebuild archive` inherits them and the
          # freemium meter + RevenueCat key are compiled into the App Store build.
          flutter build macos --release \
            --build-number="$PROJECT_BUILD_NUMBER" \
            --dart-define=ENABLE_IAP=true \
            --dart-define=REVENUECAT_MACOS_KEY="$REVENUECAT_MACOS_KEY"
      - name: Archive
        script: |
          cd "$FLUTTER_PROJECT"
          # Belt-and-suspenders for the dart-defines (ENABLE_IAP + the RevenueCat
          # key): `flutter build macos` already wrote them into
          # Flutter-Generated.xcconfig as DART_DEFINES (comma-joined base64), which
          # xcodebuild reads via the Runner config — but pass that exact value
          # explicitly too so the freemium build can't silently fall back to the
          # unlocked path if the xcconfig isn't picked up. We forward the value
          # Flutter wrote (not a hand-built one) so its own internal defines are
          # preserved. Only add the override when it's actually present, or an
          # empty DART_DEFINES= would clobber the xcconfig.
          DART_DEFINES=$(grep '^DART_DEFINES=' \
            macos/Flutter/ephemeral/Flutter-Generated.xcconfig 2>/dev/null \
            | head -1 | cut -d= -f2-)
          DART_DEFINES_ARG=""
          if [ -n "$DART_DEFINES" ]; then
            DART_DEFINES_ARG="DART_DEFINES=$DART_DEFINES"
            echo "Forwarding DART_DEFINES to xcodebuild ($DART_DEFINES_ARG)"
          else
            echo "WARNING: no DART_DEFINES in Flutter-Generated.xcconfig"
          fi
          # Signing is configured by `xcode-project use-profiles`, which sets manual
          # signing + the MAC_APP_STORE profile on the RUNNER target only. Do NOT
          # pass CODE_SIGN_IDENTITY / PROVISIONING_PROFILE_SPECIFIER as global
          # build settings here: that applies them to every target, and the Swift
          # Package Manager plugin targets (url_launcher_macos, share_plus, etc.)
          # reject a manual profile ("does not support provisioning profiles").
          # Only the app cert is in the keychain, so the Runner target signs with
          # Apple Distribution unambiguously and embeds the profile.
          # $DART_DEFINES_ARG is unquoted on purpose: it's either empty or a single
          # whitespace-free KEY=base64,base64 token, so it can't word-split badly.
          xcodebuild \
            -workspace macos/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            archive \
            -archivePath /tmp/Runner.xcarchive \
            -destination "generic/platform=macOS" \
            OTHER_CODE_SIGN_FLAGS="--timestamp" \
            CURRENT_PROJECT_VERSION="$PROJECT_BUILD_NUMBER" \
            $DART_DEFINES_ARG
      - name: Export .pkg
        script: |
          # xcodebuild -exportArchive proved unusable here: with the installer cert
          # listed in the profile (which exportArchive *requires* for packaging) it
          # re-signs the app CODE with the installer cert and dies ("this identity
          # cannot be used for signing code"), ignoring signingCertificate. So we
          # skip exportArchive and follow Codemagic's documented macOS path: the
          # archived .app is already distribution-signed with the profile embedded
          # (see the Archive step), so just wrap it in a component .pkg and sign the
          # package with the Mac Installer Distribution cert.
          _cert_dir=~/Library/Developer/Xcode/UserData/Certificates
          _installer_p12=$(ls "$_cert_dir"/MAC_INSTALLER_DISTRIBUTION_*.p12 2>/dev/null | head -1)
          keychain add-certificates --certificate "$_installer_p12"

          APP=$(ls -d /tmp/Runner.xcarchive/Products/Applications/*.app | head -1)
          echo "App: $APP"
          echo "=== app code signature ==="
          codesign -dvvv "$APP" 2>&1 || true
          echo "=== embedded provisioning profile ==="
          ls -l "$APP/Contents/embedded.provisionprofile" || \
            echo "WARNING: no embedded.provisionprofile in the archived app"
          echo "=== signing identities in keychain ==="
          security find-identity -v

          mkdir -p /tmp/mas-export
          # --component <app> /Applications builds a distribution installer that
          # drops the app into /Applications; --sign signs the .pkg with the
          # installer identity (full name → unambiguous).
          xcrun productbuild \
            --component "$APP" /Applications \
            --sign "3rd Party Mac Developer Installer: Vu-Hung Quan (8CZSU66MX5)" \
            /tmp/mas-export/ChessBookReader.pkg
          echo "=== built package ==="
          ls -l /tmp/mas-export/*.pkg
          pkgutil --check-signature /tmp/mas-export/ChessBookReader.pkg || true
    artifacts:
      - /tmp/mas-export/*.pkg
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration

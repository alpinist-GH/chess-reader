# Codemagic CI config for ChessBook Reader.
#
# The Flutter app lives in the chess_reader/ subfolder of this repo, so every
# build step cd's into it first.
#
#   ios-testflight : builds a SIGNED .ipa and uploads it to TestFlight. Requires
#                    a paid Apple Developer Program membership and an App Store
#                    Connect API key added to Codemagic (Teams/User settings ->
#                    Integrations -> App Store Connect) under the name shown in
#                    `integrations.app_store_connect` below.
#
#   ios-sideload : builds an UNSIGNED .ipa. You sign it locally with a FREE
#                  Apple ID using Sideloadly or AltStore on your Windows PC and
#                  install it over USB. No Apple credentials are stored here, so
#                  no paid Developer Program is required. (7-day app expiry.)
#
#   macos-dmg    : builds an UNSIGNED .dmg. Quick local testing only; Gatekeeper
#                  will warn on other machines.
#
#   macos-devid  : builds a Developer ID-signed + Apple-NOTARIZED .dmg for direct
#                  download (no App Store). No Gatekeeper warning. Reuses the
#                  `appstore` group (CERTIFICATE_PRIVATE_KEY) + App Store Connect
#                  integration. One-time setup: see the comments in the workflow.
#
#   macos-appstore  : builds a signed .pkg and uploads it to the Mac App Store.
#                     Uses xcodebuild archive + exportArchive (not productbuild
#                     directly) so it works on the headless CI runner.

workflows:
  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      # Must match the App Store Connect API key integration name in Codemagic.
      app_store_connect: Codemagic
    environment:
      flutter: stable
      # NOTE: no `ios_signing:` block here on purpose. That block enables
      # Codemagic's *automatic* signing, which only FETCHES existing profiles
      # and fails with "no matching profiles found" on a fresh account. We do
      # signing manually below so we can pass --create.
      groups:
        # Variable group (created in the Codemagic UI) that holds the secure
        # CERTIFICATE_PRIVATE_KEY. It is only injected into the build if listed
        # here. The key itself is NEVER stored in this file.
        - appstore
      vars:
        FLUTTER_PROJECT: chess_reader
        BUNDLE_ID: com.alpinist.chessBookReader
    scripts:
      - name: Set up code signing
        script: |
          # Create the distribution certificate + App Store provisioning profile
          # (and register the bundle ID if needed) via the App Store Connect API
          # key, then apply them to the Xcode project. --create makes this work
          # on the very first build when no profile exists yet.
          keychain initialize
          # --certificate-key lets the CLI CREATE the iOS distribution
          # certificate (not just the profile) when none exists yet, and reuse
          # the same one on later builds. CERTIFICATE_PRIVATE_KEY is a secure
          # env var you add in Codemagic (the RSA private key).
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key "@env:CERTIFICATE_PRIVATE_KEY" \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Use CocoaPods instead of Swift Package Manager
        script: |
          # ONNX Runtime's SPM framework ships with a missing MinimumOSVersion,
          # which fails App Store validation (ITMS-90208). The multistockfish
          # plugins don't support SPM either. Disabling SPM makes Flutter
          # integrate every iOS plugin via CocoaPods, which avoids both issues.
          flutter config --no-enable-swift-package-manager
      - name: Flutter pub get
        script: |
          cd "$FLUTTER_PROJECT"
          flutter pub get
      - name: Build signed IPA
        script: |
          cd "$FLUTTER_PROJECT"
          # $PROJECT_BUILD_NUMBER is Codemagic's monotonic per-project counter,
          # so each upload to TestFlight gets a unique, increasing build number.
          flutter build ipa --release \
            --build-number=$PROJECT_BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - $FLUTTER_PROJECT/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  ios-sideload:
    name: iOS unsigned (sideload)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      vars:
        FLUTTER_PROJECT: chess_reader
    scripts:
      - name: Flutter pub get
        script: |
          cd "$FLUTTER_PROJECT"
          flutter pub get
      - name: Build unsigned .app
        script: |
          cd "$FLUTTER_PROJECT"
          flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        script: |
          cd "$FLUTTER_PROJECT/build/ios/iphoneos"
          rm -rf Payload
          mkdir Payload
          cp -R Runner.app Payload/
          zip -r "$CM_BUILD_DIR/chessbook-reader-unsigned.ipa" Payload
    artifacts:
      - chessbook-reader-unsigned.ipa

  macos-dmg:
    name: macOS DMG (unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      vars:
        FLUTTER_PROJECT: chess_reader
    scripts:
      - name: Flutter pub get
        script: |
          cd "$FLUTTER_PROJECT"
          flutter pub get
      - name: Build macOS
        script: |
          cd "$FLUTTER_PROJECT"
          flutter build macos --release
      - name: Package DMG
        script: |
          cd "$FLUTTER_PROJECT"
          APP=$(ls -d build/macos/Build/Products/Release/*.app | head -1)
          hdiutil create -volname "ChessBook Reader" -srcfolder "$APP" \
            -ov -format UDZO "$CM_BUILD_DIR/chessbook-reader.dmg"
    artifacts:
      - chessbook-reader.dmg

  # ---------------------------------------------------------------------------
  # Developer ID-signed + notarized .dmg (direct download, NOT App Store).
  #
  # One-time setup before the first run:
  #   * Same App Store Connect API key integration (`Codemagic`) the iOS
  #     workflow uses (for notarization).
  #   * A Developer ID Application certificate CANNOT be created by the API key —
  #     Apple restricts that to the Account Holder via the portal (the API
  #     returns 403). So create it once, export it as a .p12, and add it to the
  #     `appstore` variable group in Codemagic as two SECURE vars:
  #       DEVID_CERTIFICATE          = base64 of the .p12
  #       DEVID_CERTIFICATE_PASSWORD = the .p12 export password
  #     How to make the .p12 (on your Mac, signed in as the Account Holder):
  #       1. Keychain Access -> Certificate Assistant -> Request a Certificate
  #          From a Certificate Authority -> save a CSR to disk.
  #       2. developer.apple.com -> Certificates -> + -> "Developer ID
  #          Application" -> upload the CSR -> download the .cer.
  #       3. Double-click the .cer to install, then in Keychain Access right-
  #          click it -> Export -> .p12 (set a password).
  #       4. base64 -i devid.p12 | pbcopy  -> paste as DEVID_CERTIFICATE.
  # ---------------------------------------------------------------------------
  macos-devid:
    name: macOS Developer ID (notarized DMG)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic
    environment:
      flutter: stable
      groups:
        - appstore
      vars:
        FLUTTER_PROJECT: chess_reader
    scripts:
      - name: Set up Developer ID signing
        script: |
          keychain initialize
          # Import the Developer ID Application .p12 supplied via env vars
          # (Apple won't let the API create this cert — Account Holder only).
          echo "$DEVID_CERTIFICATE" | base64 --decode > /tmp/devid.p12
          keychain add-certificates \
            --certificate /tmp/devid.p12 \
            --certificate-password "$DEVID_CERTIFICATE_PASSWORD"
      - name: Use CocoaPods instead of Swift Package Manager
        script: |
          flutter config --no-enable-swift-package-manager
      - name: Flutter pub get
        script: |
          cd "$FLUTTER_PROJECT"
          flutter pub get
      - name: Build and sign the app
        script: |
          cd "$FLUTTER_PROJECT"
          flutter build macos --release
          APP=$(ls -d build/macos/Build/Products/Release/*.app | head -1)
          # Re-sign every nested binary (frameworks, the multistockfish FFI
          # framework, dylibs) and the app with the Developer ID cert + hardened
          # runtime + timestamp — all required for notarization.
          CERT=$(security find-identity -v -p codesigning \
            | grep "Developer ID Application" | head -1 \
            | sed -E 's/.*"(.*)"/\1/')
          codesign --force --deep --options runtime --timestamp \
            --entitlements macos/Runner/Release.entitlements \
            --sign "$CERT" "$APP"
      - name: Notarize and package DMG
        script: |
          cd "$FLUTTER_PROJECT"
          APP=$(ls -d build/macos/Build/Products/Release/*.app | head -1)
          hdiutil create -volname "ChessBook Reader" -srcfolder "$APP" \
            -ov -format UDZO "$CM_BUILD_DIR/chessbook-reader.dmg"
          # Write the App Store Connect API private key to a temp file for notarytool.
          # The integration injects APP_STORE_CONNECT_PRIVATE_KEY, KEY_IDENTIFIER,
          # and ISSUER_ID as env vars.
          echo "$ASC_API_KEY_B64" | base64 --decode > /tmp/asc_key.p8
          xcrun notarytool submit "$CM_BUILD_DIR/chessbook-reader.dmg" \
            --key /tmp/asc_key.p8 \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --issuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --wait
          xcrun stapler staple "$CM_BUILD_DIR/chessbook-reader.dmg"
    artifacts:
      - chessbook-reader.dmg

  # ---------------------------------------------------------------------------
  # Mac App Store: build + submit via xcodebuild archive / exportArchive.
  #
  # Why this replaces the old manual-Xcode approach:
  #   The previous attempt called `productbuild` directly; that dies with
  #   CSSMERR_CSP_NO_USER_INTERACTION on a headless runner even with
  #   set-key-partition-list. `xcodebuild -exportArchive` calls productbuild
  #   internally but goes through the Codemagic-managed keychain which IS
  #   accessible to xcodebuild, so it works.
  #
  # One-time setup (App Store Connect + Codemagic UI):
  #   1. App Store Connect: enable the macOS platform on the
  #      com.alpinist.chessBookReader app record.
  #   2. The same `appstore` variable group and `Codemagic` ASC integration
  #      that the ios-testflight workflow uses are all that's needed —
  #      fetch-signing-files will create the Mac App Distribution and Mac
  #      Installer Distribution certs (and MAC_APP_STORE profile) on first run.
  # ---------------------------------------------------------------------------
  macos-appstore:
    name: macOS App Store
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic
    environment:
      flutter: stable
      groups:
        - appstore
      vars:
        FLUTTER_PROJECT: chess_reader
        BUNDLE_ID: com.alpinist.chessBookReader
    scripts:
      - name: Set up code signing
        script: |
          keychain initialize

          # Step 1: Mac App Distribution cert + the MAC_APP_STORE provisioning
          # profile. The profile lists ONLY the app-signing (Apple Distribution)
          # cert. The Mac Installer Distribution cert is deliberately NOT part of
          # the profile — putting it there makes `xcode-project use-profiles` set
          # the app's CODE_SIGN_IDENTITY to the installer cert, which then fails
          # the build with "this identity cannot be used for signing code". Per
          # Codemagic's macOS signing docs the installer cert is used separately,
          # only to sign the final .pkg (packageSigningCertificate in the export
          # options).
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type MAC_APP_STORE \
            --certificate-key "@env:CERTIFICATE_PRIVATE_KEY" \
            --create

          # Step 2: Mac Installer Distribution cert (dedicated MAC_INSTALLER_KEY,
          # PKCS#1 RSA format stored in Codemagic). A dedicated key guarantees the
          # .p12 always has the matching private key across runs. Added to the
          # keychain only — exportArchive picks it up by name for the .pkg.
          # `certificates list` exits 0 even when empty — count .p12 files to detect
          # whether a cert was actually saved before deciding to create a new one.
          _cert_dir=~/Library/Developer/Xcode/UserData/Certificates
          _before=$(ls "$_cert_dir"/*.p12 2>/dev/null | wc -l)
          app-store-connect certificates list \
            --type MAC_INSTALLER_DISTRIBUTION \
            --certificate-key "@env:MAC_INSTALLER_KEY" \
            --save
          _after=$(ls "$_cert_dir"/*.p12 2>/dev/null | wc -l)
          if [ "$_after" -le "$_before" ]; then
            app-store-connect certificates create \
              --type MAC_INSTALLER_DISTRIBUTION \
              --certificate-key "@env:MAC_INSTALLER_KEY" \
              --save
          fi

          keychain add-certificates
          xcode-project use-profiles
      - name: Flutter pub get + build
        script: |
          cd "$FLUTTER_PROJECT"
          flutter pub get
          # flutter build macos generates the ephemeral files (FlutterInputs/
          # FlutterOutputs.xcfilelist, FlutterGeneratedPluginSwiftPackage/
          # Package.swift) that xcodebuild archive needs before it can start.
          flutter build macos --release \
            --build-number="$PROJECT_BUILD_NUMBER"
      - name: Archive
        script: |
          cd "$FLUTTER_PROJECT"
          xcodebuild \
            -workspace macos/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            archive \
            -archivePath /tmp/Runner.xcarchive \
            -destination "generic/platform=macOS" \
            OTHER_CODE_SIGN_FLAGS="--timestamp" \
            CURRENT_PROJECT_VERSION="$PROJECT_BUILD_NUMBER"
      - name: Export .pkg
        script: |
          # xcode-project use-profiles generates /Users/builder/export_options.plist
          # but intermittently produces <array/> for provisioningProfiles when it
          # cannot match the saved profile to the keychain. Write the plist from
          # scratch: find the installed profile by decoding each candidate and
          # matching this app's bundle ID, then build a complete plist ourselves.
          python3 - <<'PYEOF'
          import glob, os, plistlib, subprocess, sys

          BUNDLE_ID = 'com.alpinist.chessBookReader'
          TEAM_ID   = '8CZSU66MX5'
          APP_ID    = f'{TEAM_ID}.{BUNDLE_ID}'

          # Profiles may be named MAC_APP_STORE_*.provisionprofile (by
          # fetch-signing-files), <profile-name>.provisionprofile (by
          # `profiles create --save`), or <UUID>.provisionprofile (after
          # `xcode-project use-profiles` installs them). Don't rely on the name:
          # decode every candidate in both dirs and match on the bundle ID.
          search_dirs = [
              os.path.expanduser(
                  '~/Library/Developer/Xcode/UserData/Provisioning Profiles'),
              os.path.expanduser(
                  '~/Library/MobileDevice/Provisioning Profiles'),
          ]
          candidates = []
          for d in search_dirs:
              for ext in ('*.provisionprofile', '*.mobileprovision'):
                  candidates.extend(glob.glob(os.path.join(d, ext)))

          prof_name = None
          for pf in candidates:
              try:
                  cms = subprocess.check_output(['security', 'cms', '-D', '-i', pf])
                  prof = plistlib.loads(cms)
              except Exception as e:
                  print(f'skip {pf}: {e}')
                  continue
              # Entitlements carry TEAM_ID.BUNDLE_ID in application-identifier.
              ent = prof.get('Entitlements', {})
              app_id = ent.get('com.apple.application-identifier', '')
              if app_id == APP_ID:
                  prof_name = prof['Name']
                  print(f'Matched profile {prof_name!r} in {pf}')
                  break

          if not prof_name:
              print('Candidates scanned:', candidates)
              sys.exit(f'ERROR: no provisioning profile found for {APP_ID}')

          p = {
              'destination':               'export',
              'method':                    'app-store-connect',
              'signingStyle':              'manual',
              'teamID':                    TEAM_ID,
              'signingCertificate':        'Apple Distribution',
              'packageSigningCertificate': '3rd Party Mac Developer Installer',
              'provisioningProfiles':      {BUNDLE_ID: prof_name},
          }
          with open('/Users/builder/export_options.plist', 'wb') as f:
              plistlib.dump(p, f)
          PYEOF
          echo "=== export_options.plist ==="
          cat /Users/builder/export_options.plist
          echo "=== signing identities in keychain ==="
          security find-identity -v
          xcodebuild -exportArchive \
            -archivePath /tmp/Runner.xcarchive \
            -exportPath /tmp/mas-export \
            -exportOptionsPlist /Users/builder/export_options.plist
    artifacts:
      - /tmp/mas-export/*.pkg
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
